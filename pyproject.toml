[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc"
version = "0.1.0"
description = "An agentic software engineering system: requirement -> plan -> code/tests/docs -> PR -> review -> CR -> release, with human approval gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The generated sample apps (URL shortener etc.) and their tests run with these.
app = ["fastapi>=0.110", "sqlalchemy>=2.0", "httpx>=0.27"]
anthropic = ["anthropic>=0.40"]
openai = []  # the OpenAI-compatible provider uses the standard library only
dev = ["pytest>=8", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
sdlc = "sdlc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdlc_agent = ["prompts/*.md", "_sandbox/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py310"
# Fixture and seed code is the *target* of the system; it is linted inside each workspace by the validator.
extend-exclude = ["examples", "fixtures", "workspaces"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
